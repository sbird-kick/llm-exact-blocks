<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Def-use Live Reader</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15181d; --muted:#5c6470; --line:#dfe3e8;
  --accent:#2f6fdf; --accent-soft:#e3ecfc; --good:#177a45; --good-soft:#e1f3e8;
  --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#9a6200; --warn-soft:#fdf0d8; --bar:#9db8ea; --bar2:#c9d2de;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a21; --ink:#e8ebf0; --muted:#98a2b3; --line:#2a303b;
  --accent:#7aa7ff; --accent-soft:#1c2a45; --good:#5fd08f; --good-soft:#15301f;
  --bad:#ff7b72; --bad-soft:#3a1a19; --warn:#f0b45a; --warn-soft:#352a14; --bar:#3f65b5; --bar2:#3a4250;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:24px;margin:0 12px 0 0;font-weight:700;letter-spacing:.2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;padding:7px 14px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff}
.seg button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:6px;background:var(--bar2);vertical-align:middle}
.seg button .dot.live{background:var(--good)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px;padding:7px 12px;border-radius:9px;cursor:pointer}
main{max-width:1500px;margin:0 auto;padding:18px 24px 40px}
.inrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
textarea{width:100%;min-height:92px;resize:vertical;font:inherit;font-size:21px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.side{display:flex;flex-direction:column;gap:10px;min-width:260px}
select{font:inherit;font-size:16px;padding:8px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:340px}
.run{background:var(--accent);color:#fff;border:0;font-size:20px;font-weight:600;padding:12px 18px;border-radius:12px;cursor:pointer}
.run:disabled{opacity:.55;cursor:wait}
label.chk{font-size:15px;color:var(--muted)}
#status{margin:10px 2px 16px;color:var(--muted);font-size:16px;min-height:24px}
#status.err{color:var(--bad)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:650}
.big{font-size:34px;font-weight:700;font-family:var(--mono);letter-spacing:.5px}
.mid{font-size:22px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:14px} .mono{font-family:var(--mono)}
table{border-collapse:collapse;width:100%}
td,th{padding:4px 6px;text-align:left;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
tr.pick td{background:var(--accent-soft)}
.barc{position:relative;height:18px;background:transparent;min-width:120px}
.bar{position:absolute;top:2px;height:14px;border-radius:3px;background:var(--bar)}
.bar.neg{background:var(--bar2)}
.zero{position:absolute;top:0;bottom:0;width:1px;background:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:14px;font-weight:650;margin:2px 4px 2px 0}
.t-good{background:var(--good-soft);color:var(--good)} .t-bad{background:var(--bad-soft);color:var(--bad)}
.t-warn{background:var(--warn-soft);color:var(--warn)} .t-mute{background:var(--bar2);color:var(--ink)}
.decision{font-size:30px;font-weight:800}
.tok{display:inline-block;font-family:var(--mono);font-size:14px;border:1px solid var(--line);border-radius:5px;padding:0 4px;margin:1px;white-space:pre}
.tok.num{background:var(--accent-soft);border-color:var(--accent)}
.tok.ans{background:var(--warn-soft);border-color:var(--warn)}
.full{grid-column:1/-1}
details summary{cursor:pointer;color:var(--muted);font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:17px}
.kv div:nth-child(odd){color:var(--muted)}
.prov li{font-size:14px;margin:3px 0;word-break:break-word}
.caveat{border-left:4px solid var(--warn);padding:6px 12px;background:var(--warn-soft);border-radius:6px;font-size:15px;margin-top:8px}
@media (max-width:700px){ body{font-size:16px} header,main{padding-left:16px;padding-right:16px} .inrow{grid-template-columns:1fr} .grid{grid-template-columns:1fr} .side{min-width:0} }
</style>
</head>
<body>
<header>
  <h1>Def-use live reader</h1>
  <div class="seg" id="hosts"></div>
  <span class="spacer"></span>
  <span class="small muted" id="mem"></span>
  <button class="btn" id="theme" title="toggle light / dark">theme</button>
</header>
<main>
  <div class="inrow">
    <textarea id="prompt" placeholder="Type a word problem. ' The answer is' is appended if the prompt does not end with it."></textarea>
    <div class="side">
      <select id="examples"><option value="">Example prompts...</option></select>
      <label class="chk"><input type="checkbox" id="cue" checked> append " The answer is"</label>
      <button class="run" id="run">Run &nbsp;<span class="small">(Ctrl+Enter)</span></button>
    </div>
  </div>
  <div id="status"></div>
  <div id="out"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let busy = false, poll = null, t0 = 0, ST = null;
try { const th = localStorage.getItem('defuse_theme') || 'dark'; document.documentElement.dataset.theme = th; } catch(e) { document.documentElement.dataset.theme = 'dark'; }
$('#theme').onclick = () => { const d = document.documentElement; d.dataset.theme = d.dataset.theme === 'dark' ? 'light' : 'dark'; try{localStorage.setItem('defuse_theme', d.dataset.theme)}catch(e){} };

function drawHosts(st){
  const h = st && st.label ? st.label : 'host';
  $('#hosts').innerHTML = `<button class="on">${esc(h)}<span class="dot ${st && st.loaded ? 'live' : ''}" title="${st && st.loaded ? 'loaded' : 'not loaded'}"></span></button>`;
}
async function status(){
  try { const r = await fetch('/api/status'); const st = await r.json(); ST = st; drawHosts(st);
    const m = st.memory || {};
    $('#mem').textContent = `GPU ${m.cuda_allocated_GiB ?? '?'} GiB allocated · RSS ${m.VmRSS_GiB ?? '?'} GiB · pool free ${m.MemAvailable_GiB ?? '?'} GiB`;
    return st; } catch(e) { return null; }
}
async function loadExamples(){
  try { const ex = await (await fetch('/api/examples')).json();
    $('#examples').innerHTML = '<option value="">Example prompts...</option>' + ex.map((e,i) => `<option value="${i}">${esc(e.label)}</option>`).join('');
    $('#examples').onchange = ev => { const i = ev.target.value; if (i !== '') $('#prompt').value = ex[+i].prompt; };
  } catch(e) {}
}
const pct = v => (100*v).toFixed(v < 0.001 ? 3 : 1) + '%';
function tag(t, cls){ return `<span class="tag ${cls}">${esc(t)}</span>`; }

function render(o){
  const numPos = new Set(); o.numerals.forEach(n => n.token_pos.forEach(p => numPos.add(p)));
  const toks = o.tokens.map((t,i) => `<span class="tok ${numPos.has(i)?'num':''} ${i===o.tokens.length-1?'ans':''}">${esc(t)}</span>`).join('');
  let h = '<div class="grid">';
  // ---- host prediction
  const tk = o.host.topk, mx = tk[0].p;
  h += `<div class="card"><h2>Host ${esc(o.model)}: next token at the answer position</h2><table>` +
    tk.map(t => `<tr><td class="mono" style="width:30%">${esc(JSON.stringify(t.token))}</td><td><div class="barc"><div class="bar" style="left:0;width:${t.p/mx*100}%"></div></div></td><td class="mono small" style="width:70px;text-align:right">${pct(t.p)}</td></tr>`).join('') +
    `</table><div style="margin-top:10px"><span class="muted">host's greedy answer (after the dumper's added space):</span> <span class="mono mid">${esc(o.host.greedy_text)}</span></div>` +
    `<div><span class="muted">host's number:</span> <b class="mid">${esc(o.host.host1 ?? 'none')}</b> <span class="small muted">(the first number in that text, as run.py host_fields reads it)</span></div></div>`;
  // ---- numerals
  h += `<div class="card"><h2>Numbers found (digit-run locator)</h2>`;
  if (!o.numerals.length) h += '<div class="mid muted">no numbers in the prompt</div>';
  else h += `<table><tr><th>#</th><th>value</th><th>token positions</th></tr>` +
    o.numerals.map(n => `<tr><td>${n.i}</td><td class="mono mid">${esc(n.text)}</td><td class="mono small">${esc(n.token_pos.join(', '))}</td></tr>`).join('') + '</table>';
  h += `<details style="margin-top:8px"><summary>tokens fed to the host (${o.tokens.length})</summary><div style="margin-top:6px">${toks}</div></details></div>`;
  // ---- the def-use decision (reader B x 3 layers, DU-AG, gate)
  const r = o.record, g = o.gate;
  h += `<div class="card full"><h2>Def-use decision: reader B at three layers, DU-AG, ${g ? 'gate' : 'no gate'}</h2>` +
    `<div class="decision">${tag(o.decision, o.decision === 'FIRE' ? 't-good' : 't-warn')}</div>` +
    `<div class="mid" style="margin-top:4px">system answer: <b>${esc(o.system_answer ?? 'none')}</b> <span class="small muted">(host's answer ${esc(r.host1 ?? 'none')})</span></div>` +
    `<div class="small">${esc(o.why)}</div>` +
    `<div class="kv" style="margin-top:8px"><div>program L20 / L24 / L28</div><div class="mono small">${['20','24','28'].map(L => esc(o.programs[L] ?? 'none')).join(' | ')} ${o.layers_agree ? tag('agree','t-good') : tag('disagree','t-warn')}</div>` +
    `<div>value of the L24 program</div><div class="mono">${esc(r.value24 ?? 'none')}</div>` +
    `<div>host class</div><div>${esc(r.host_class ?? 'n/a')} <span class="small muted">(DU-AG fires only on echo / other, never on a silent host)</span></div>` +
    `<div>beam log-prob L20 / L24 / L28</div><div class="mono small">${['20','24','28'].map(L => r.lp[L] === null ? 'n/a' : r.lp[L].toFixed(3)).join(' | ')}</div>` +
    (g ? `<div>gate</div><div class="small">score ${g.score === null ? 'n/a (DU-AG did not fire)' : g.score.toFixed(3)} vs cut ${g.cut.toFixed(3)} · tau ${(100*g.tau).toFixed(2)}% · steps ${esc(r.steps24 ?? 'n/a')}</div>` : '<div>gate</div><div class="small muted">none loaded: the ungated DU-AG decision is shown</div>') +
    `</div><div class="caveat">${esc(ST && ST.caveat || '')}</div>` +
    `<div class="small muted" style="margin-top:6px">files: ${esc(Object.entries(o.files).map(([k,v]) => k+' '+v.slice(0,8)).join(' · '))}; ${o.time_s}s</div></div>`;
  h += '</div>';
  $('#out').innerHTML = h;
}
async function run(){
  if (busy) return; const prompt = $('#prompt').value.trim(); if (!prompt) return;
  busy = true; $('#run').disabled = true; t0 = Date.now(); $('#status').className = '';
  poll = setInterval(() => { $('#status').innerHTML = `<span class="spin"></span>running ... ${((Date.now()-t0)/1000).toFixed(1)}s`; }, 300);
  try {
    const r = await fetch('/api/predict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({prompt, append_cue: $('#cue').checked})});
    const o = await r.json();
    if (!r.ok) throw new Error(o.error || r.status);
    render(o); $('#status').textContent = `${o.model}: ${o.time_s}s for this prompt`;
  } catch(e) { $('#status').className = 'err'; $('#status').textContent = String(e.message || e); }
  finally { clearInterval(poll); busy = false; $('#run').disabled = false; status(); }
}
$('#run').onclick = run;
$('#prompt').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) run(); });
drawHosts(null); status(); loadExamples(); setInterval(status, 15000);
</script>
</body>
</html>
